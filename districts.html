    const listContainer = document.getElementById('districtList');
    const searchInput = document.getElementById('searchInput');
    const submitBtn = document.getElementById('submitBtn');
    const selectedDistricts = new Map();

    // 🔴 تابع رندر زنده لیست محله‌ها
    function renderDistricts(filter = "") {
      listContainer.innerHTML = "";
      
      Object.keys(districts).forEach(name => {
        if (name.includes(filter)) {
          const item = districts[name];
          const isChecked = selectedDistricts.has(name);

          const div = document.createElement('div');
          div.className = "flex items-center justify-between p-3 border border-gray-200 rounded-xl bg-gray-50 hover:bg-gray-100 transition cursor-pointer select-none";
          div.innerHTML = `
            <span class="text-sm font-medium text-gray-800">${name}</span>
            <input type="checkbox" value="${name}" ${isChecked ? 'checked' : ''} 
                   class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
          `;

          const checkbox = div.querySelector('input');

          // قابلیت انتخاب با کلیک روی تمام قسمت‌های کارت محله
          div.addEventListener('click', (e) => {
            if (e.target !== checkbox) {
              checkbox.checked = !checkbox.checked;
            }
            if (checkbox.checked) {
              selectedDistricts.set(name, item);
            } else {
              selectedDistricts.delete(name);
            }
          });

          listContainer.appendChild(div);
        }
      });
    }

    // 🔴 جستجوی لحظه‌ای
    searchInput.addEventListener('input', (e) => {
      renderDistricts(e.target.value.trim());
    });

    // 🔴 نمایش اولیه
    renderDistricts();

    // 🔴 ارسال دیتای انتخاب‌شده به ربات تلگرام
    submitBtn.addEventListener('click', () => {
      if (selectedDistricts.size === 0) {
        tg.showAlert("لطفاً حداقل یک محله را انتخاب کنید.");
        return;
      }

      const resultData = Array.from(selectedDistricts.entries()).map(([name, data]) => ({
        name: name,
        id: data.id,
        slug: data.slug
      }));

      tg.sendData(JSON.stringify(resultData));
    });
